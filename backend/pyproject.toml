[project]
name = "whoholds-backend"
version = "0.1.0"
description = "A-share top-10 shareholder network analyzer — backend"
readme = "../README.md"
license = { text = "MIT" }
authors = [
    { name = "alex.chen7ac", email = "alex.chen7ac@gmail.com" },
]
keywords = ["a-share", "shareholder-network", "fastapi", "sqlite", "akshare"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
]

[project.urls]
Homepage = "https://github.com/gongxh13/whoholds"
Repository = "https://github.com/gongxh13/whoholds"
Issues = "https://github.com/gongxh13/whoholds/issues"

[project.optional-dependencies]
# `pip install .[etl]` (or `uv sync --extra etl`) — pulls akshare for ETL only.
# Keeping it optional means request-path workers don't drag in pandas/etc.
etl = [
    "akshare>=1.16",
    "pandas>=2.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
